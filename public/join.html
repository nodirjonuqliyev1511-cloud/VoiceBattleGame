<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ШумParty — участник</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/nursery.css">
<link rel="stylesheet" href="/team-chooser.css">
<script src="/socket.io/socket.io.js"></script>
<script src="/platform-brand.js"></script><script src="/nursery-art.js"></script>
<script src="/team-chooser.js"></script>
<style>
  .screen { min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 24px; text-align:center; }
  .logo { font-size: 30px; margin-bottom: 6px; }
  .logo .hot { color: var(--hot-magenta); }
  .logo .cyan { color: var(--electric-cyan); }

  .field { width: 100%; max-width: 300px; margin: 10px 0; }

  #waitScreen .pulse {
    width: 90px; height: 90px; border-radius: 50%; margin: 20px auto;
    background: var(--stage-black-2); border: 2px solid var(--hot-magenta);
    display:flex; align-items:center; justify-content:center; font-size: 34px;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  #countdownScreen { display:none; }
  .cd-num { font-size: 140px; color: var(--warn-yellow); }

  #battleScreen { display:none; width:100%; }
  .timer-pill {
    display:inline-block; background: var(--stage-black-2); border:1px solid var(--line);
    border-radius: 999px; padding: 6px 18px; font-weight:800; color: var(--warn-yellow); margin-bottom: 14px;
  }
  .speedo {
    width: 100%; max-width: 360px; height: 340px; margin: 0 auto;
    background: linear-gradient(180deg, #1a1c26 0%, #0a0b10 100%);
    border-radius: 24px; border: 1px solid var(--line);
    position: relative; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end;
  }
  .speedo::before {
    content:''; position:absolute; inset:0;
    background-image: repeating-linear-gradient(180deg, transparent 0 34px, rgba(255,255,255,0.08) 34px 44px);
  }
  .speedo-glow {
    position:absolute; bottom:0; left:0; right:0; height: 0%;
    background: linear-gradient(0deg, rgba(255,46,99,0.10), rgba(8,217,214,0.20) 55%, rgba(255,210,63,0.32));
    transition: height 0.08s linear;
  }
  .speedo-car { position:relative; width: 78%; margin: 0 auto 4px; transition: transform 0.08s ease-out; z-index:2; }
  .speedo-car svg, .speedo-car img { width: 100%; height: auto; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.6)); }
  .speedo-value { position:relative; font-family:'Anton',sans-serif; font-size: 46px; z-index:2; padding-bottom: 20px; }
  .speedo-unit { font-size: 14px; color: var(--muted); font-family:'Inter',sans-serif; }
  .my-gauge { position:relative; width: 150px; height: 82px; margin: 10px auto 0; z-index:2; }
  .my-gauge svg { position:absolute; inset:0; width:100%; height:100%; }
  .my-gauge-needle {
    position:absolute; left:50%; bottom:4px; width:5px; height:60px; margin-left:-2.5px;
    background: linear-gradient(180deg, #ff2e63 0%, #ff2e63 16%, #f2f2f2 28%, #f2f2f2 100%);
    border-radius: 3px 3px 1px 1px;
    transform-origin: bottom center; transform: rotate(-90deg);
    transition: transform 0.1s ease-out; box-shadow: 0 0 10px rgba(255,255,255,0.7);
  }
  .my-gauge-pivot {
    position:absolute; left:50%; bottom:1px; width:17px; height:17px; margin-left:-8.5px;
    border-radius:50%; background: radial-gradient(circle at 35% 30%, #f5f5f5, #9a9da3 55%, #3a3c40 100%);
    box-shadow: 0 0 8px rgba(0,0,0,0.6), 0 0 5px rgba(255,255,255,0.4);
  }

  #resultsScreen { display:none; }
  .place-big { font-size: 90px; color: var(--warn-yellow); }
  body.baby-controller { --stage-black:#fff7e9; --stage-black-2:#fffdf7; --paper:#71584e; --muted:#9c8476; --line:#e6d3ba; --hot-magenta:#c87993; --electric-cyan:#4a96a3; --warn-yellow:#bb824a; background:repeating-linear-gradient(90deg,#e5f1eb 0 45px,#dcece7 45px 90px); font-family:'Trebuchet MS',Arial,sans-serif; }
  body.baby-controller.girl-controller { background:repeating-linear-gradient(90deg,#fce8e9 0 45px,#f7dde2 45px 90px); }
  .baby-controller .display,.baby-controller .speedo-value { font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900; }
  .baby-controller .logo { font-size:30px;letter-spacing:-1px; }.baby-controller .screen { padding:22px; }
  .baby-controller #joinScreen,.baby-controller #waitScreen,.baby-controller #resultsScreen { background:#fffbf1;border:2px solid #e2cdb4;border-radius:22px;padding:27px 22px;width:min(380px,100%);box-shadow:0 7px 0 #b28e6a18; }
  .baby-controller #waitScreen .pulse { width:190px;height:190px;border:0;background:none;animation:none;margin:5px auto; }
  .baby-controller .speedo { background:#fffbf1;border:2px solid #e2cdb4;box-shadow:0 7px 0 #b28e6a18; }.baby-controller .speedo::before { opacity:.2; }.baby-controller .speedo-glow { background:linear-gradient(0deg,#9dd9d566,#f7d6df77); }.baby-controller .speedo-car { width:190px;margin-bottom:-15px; }.baby-controller .speedo-value { font-size:39px; }
  .baby-controller .btn-primary { background:#559ca7;color:#fffaf0;box-shadow:0 4px 0 #377d89;border:2px solid #377d89; }.baby-controller .btn-primary:hover {box-shadow:0 5px 0 #377d89;}.baby-controller .timer-pill { background:#fffbf1;color:#8d7060; }.baby-controller .cd-num { color:#4d9aa7; }.baby-controller .place-big { color:#4d9aa7; }
  #babyResultArt {width:170px;margin:5px auto;}#playerConnection {position:fixed;top:12px;left:12px;right:12px;padding:12px;background:#fff1d8;color:#745744;border:1px solid #c09b73;border-radius:12px;font:14px 'Trebuchet MS',sans-serif;z-index:20;text-align:center;}#playerConnection[hidden]{display:none;}
</style>
</head>
<body>
<div id="playerConnection" role="alert" hidden></div>
<div class="screen">

  <div id="joinScreen">
    <div class="logo display" id="joinLogo"><span data-platform-name>ШумParty</span></div>
    <div style="color:var(--muted); font-size:15px;" id="joinDescription">Введи код комнаты и своё имя</div>
    <input type="text" id="roomInput" class="field" placeholder="КОД КОМНАТЫ" maxlength="6" autocomplete="off" style="text-transform:uppercase; letter-spacing:0.1em;">
    <input type="text" id="nameInput" class="field" placeholder="Твоё имя" maxlength="20" autocomplete="off">
    <div class="team-choice" id="teamChoice" hidden><div class="team-choice-grid"><button type="button" class="team-pick boy" id="chooseBoy" aria-pressed="false"><span id="teamBoyArt"></span><strong>Команда<br>«Мальчик»</strong><small id="boyAvailability"></small></button><button type="button" class="team-pick girl" id="chooseGirl" aria-pressed="false"><span id="teamGirlArt"></span><strong>Команда<br>«Девочка»</strong><small id="girlAvailability"></small></button></div><p class="team-choice-hint" id="teamChoiceHint"></p></div>
    <button class="btn-primary" id="joinBtn">ПРИСОЕДИНИТЬСЯ</button>
    <div id="errorText" style="color:var(--hot-magenta); font-size:13px; margin-top:14px; max-width:280px;"></div>
  </div>

  <div id="waitScreen" style="display:none;">
    <div class="logo display"><span class="cyan" id="waitingTitle">ТЫ В ИГРЕ</span></div>
    <div class="pulse" id="waitingArt">🎤</div>
    <div style="color:var(--muted);" id="waitingHint">Жди, пока ведущий начнёт баттл…</div>
  </div>

  <div id="countdownScreen">
    <div class="eyebrow">ПРИГОТОВЬСЯ</div>
    <div class="cd-num display" id="cdNum">3</div>
  </div>

  <div id="battleScreen">
    <div class="timer-pill" id="timerPill">0:00</div>
    <div class="eyebrow" style="margin-bottom:10px;" id="battleHint">ОРИ КАК МОЖНО ГРОМЧЕ!</div>
    <div class="speedo">
      <div class="speedo-glow" id="speedoGlow"></div>
      <div class="speedo-car" id="speedoCar"></div>
      <div class="my-gauge">
        <svg viewBox="0 0 120 66" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="my-gg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#4fd675"/>
              <stop offset="45%" stop-color="#ffd23f"/>
              <stop offset="100%" stop-color="#ff2e63"/>
            </linearGradient>
          </defs>
          <path d="M6,58 A54,54 0 0 1 114,58" stroke="#08080c" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path d="M10,58 A50,50 0 0 1 110,58" stroke="#1c1d26" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M10,58 A50,50 0 0 1 110,58" stroke="url(#my-gg)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.95"/>
          <g stroke="#9a9ea6" stroke-width="1.6" stroke-linecap="round">
            <line x1="10" y1="58" x2="19" y2="58"/>
            <line x1="24.64" y1="22.64" x2="31" y2="29"/>
            <line x1="60" y1="8" x2="60" y2="17"/>
            <line x1="95.36" y1="22.64" x2="89" y2="29"/>
            <line x1="110" y1="58" x2="101" y2="58"/>
          </g>
        </svg>
        <div class="my-gauge-needle" id="myNeedle"></div>
        <div class="my-gauge-pivot"></div>
      </div>
      <div class="speedo-value" id="speedoValue">0<span class="speedo-unit"> дБ</span></div>
    </div>
  </div>

  <div id="resultsScreen">
    <div id="babyResultArt" hidden></div>
    <div class="eyebrow">ФИНИШ</div>
    <div class="place-big display" id="placeBig">-</div>
    <div style="color:var(--muted); font-size:14px; margin-top:10px;" id="placeCaption">место в баттле</div>
    <div style="color:var(--electric-cyan); font-size:20px; margin-top:10px; font-weight:800;" id="myPeak"></div>
    <div style="color:var(--muted); font-size:15px; margin-top:6px;" id="myDistance"></div>
    <div style="color:var(--muted); font-size:13px; margin-top:18px;">Смотри полный результат на экране ведущего</div>
  </div>

</div>

<script>
const VEHICLE_IMAGES = {
  tractor: '/img/tractor.png',
  coupe: '/img/coupe.png',
  classic: '/img/classic.png',
  suv: '/img/suv.png'
};
function vehicleImg(type, extraStyle) {
  const src = VEHICLE_IMAGES[type] || VEHICLE_IMAGES.coupe;
  return `<img src="${src}" alt="${type}" style="${extraStyle || ''}">`;
}

const socket = io();
let audioCtx, analyser, micStream, rafId, myCarColor = '#08d9d6', myVehicleType = 'coupe';
let mediaRecorder = null;
let recordedChunks = [];
let isBabyGame = false, myBabyType = 'boy';

const screens = ['joinScreen','waitScreen','countdownScreen','battleScreen','resultsScreen'];
function show(id) {
  screens.forEach(s => document.getElementById(s).style.display = (s === id ? 'block' : 'none'));
}

const params = new URLSearchParams(location.search);
const prefillRoom = params.get('room');
if (prefillRoom) document.getElementById('roomInput').value = prefillRoom.toUpperCase();
const teamChooser = createTeamChooser({socket});

async function setupMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
}

// ---- запись голоса на весь раунд, чтобы ведущий потом мог переслушать ----
function pickRecorderMimeType() {
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  for (const type of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }
  return ''; // пусть браузер сам выберет
}

function startRecording() {
  if (!micStream || !window.MediaRecorder) return;

  recordedChunks = [];
  const mimeType = pickRecorderMimeType();

  try {
    const options = mimeType ? { mimeType, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 };
    mediaRecorder = new MediaRecorder(micStream, options);
  } catch (e) {
    console.warn('Запись голоса недоступна в этом браузере:', e);
    mediaRecorder = null;
    return;
  }

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onerror = (e) => {
    console.warn('Ошибка записи голоса:', e.error || e);
  };

  mediaRecorder.start();
}

function sendRecordedChunks(mimeType) {
  if (!recordedChunks.length) return;
  const chunksToSend = recordedChunks;
  recordedChunks = [];

  const blob = new Blob(chunksToSend, { type: mimeType || 'audio/webm' });
  blob.arrayBuffer()
    .then((arrayBuffer) => {
      socket.emit('submitRecording', { mimeType: mimeType || 'audio/webm', buffer: arrayBuffer });
    })
    .catch((e) => console.warn('Не удалось отправить запись:', e));
}

function stopRecordingAndSend() {
  if (!mediaRecorder) return;

  const recorder = mediaRecorder;
  const mimeType = recorder.mimeType || 'audio/webm';

  // если рекордер уже почему-то не активен — просто досылаем то, что уже накопилось
  if (recorder.state === 'inactive') {
    sendRecordedChunks(mimeType);
    return;
  }

  recorder.onstop = () => sendRecordedChunks(mimeType);
  recorder.stop();
}

function getRms() {
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);
  let sumSquares = 0;
  for (let i = 0; i < data.length; i++) {
    const v = (data[i] - 128) / 128;
    sumSquares += v * v;
  }
  return Math.sqrt(sumSquares / data.length);
}

const SCORE_MIN = 0, SCORE_MAX = 200;
const RMS_DB_FLOOR = -50, RMS_DB_CEIL = -5;
function rmsToScore(rms) {
  const safeRms = Math.max(rms, 0.000001);
  const db = 20 * Math.log10(safeRms);
  const pct = ((db - RMS_DB_FLOOR) / (RMS_DB_CEIL - RMS_DB_FLOOR)) * 200;
  return Math.max(0, Math.min(200, pct));
}
function scoreToPercent(score) {
  return Math.max(0, Math.min(100, (score / SCORE_MAX) * 100));
}

document.getElementById('joinBtn').addEventListener('click', async () => {
  const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
  const babyRoom = teamChooser.mode === 'baby';
  const name = babyRoom ? '' : document.getElementById('nameInput').value.trim() || 'Игрок';
  const errEl = document.getElementById('errorText');
  errEl.textContent = '';

  if (!roomCode) {
    errEl.textContent = 'Введи код комнаты';
    return;
  }
  if (babyRoom && !teamChooser.canJoin()) { errEl.textContent = 'Выберите свободную команду'; return; }
  if (babyRoom) teamChooser.setPending(true);

  try {
    await setupMic();
  } catch (e) {
    if (babyRoom) teamChooser.setPending(false);
    errEl.textContent = 'Не удалось получить доступ к микрофону. Разреши доступ в браузере и попробуй снова.';
    return;
  }

  socket.emit('joinRoom', { roomCode, playerName: name, ...(babyRoom ? {babyType: teamChooser.side} : {}) });
});

socket.on('joinSuccess', ({ carColor, vehicleType, gameMode, babyType }) => {
  teamChooser.joined();
  document.getElementById('playerConnection').hidden = true;
  myCarColor = carColor || myCarColor;
  myVehicleType = vehicleType || myVehicleType;
  isBabyGame = gameMode === 'baby';
  myBabyType = babyType === 'girl' ? 'girl' : 'boy';
  document.body.classList.toggle('baby-controller', isBabyGame);
  document.body.classList.toggle('girl-controller', isBabyGame && myBabyType === 'girl');
  document.getElementById('speedoCar').innerHTML = isBabyGame ? NurseryArt.baby(myBabyType) : vehicleImg(myVehicleType);
  if (isBabyGame) {
    document.getElementById('joinLogo').innerHTML = '<span class="cyan">'+PlatformBrand.babyFirstLine+'</span><br><span class="hot" style="font-size:.65em">'+PlatformBrand.babySecondLine+'</span>';
    document.title = PlatformBrand.babyName + ' — участник';
    document.getElementById('waitingTitle').textContent = myBabyType === 'girl' ? 'КОМАНДА «ДЕВОЧКА»' : 'КОМАНДА «МАЛЬЧИК»';
    document.getElementById('waitingArt').innerHTML = NurseryArt.baby(myBabyType);
    document.getElementById('waitingHint').textContent = 'Соберите команду вокруг этого телефона. После старта кричите вместе!';
    document.getElementById('battleHint').textContent = 'КОМАНДА, КРИЧИМ ВМЕСТЕ!';
    document.getElementById('placeCaption').textContent = 'место вашей команды';
  }
  show('waitScreen');
});

socket.on('joinError', (msg) => {
  teamChooser.failed();
  document.getElementById('errorText').textContent = msg;
  if (isBabyGame && msg === 'Ведущий завершил игру') {
    teamChooser.left();
    cancelAnimationFrame(rafId);
    if (myStopwatch) { clearInterval(myStopwatch); myStopwatch = null; }
    if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); }
    recordedChunks = [];
    show('joinScreen');
  }
});

socket.on('countdown', (seconds) => {
  show('countdownScreen');
  let n = seconds;
  document.getElementById('cdNum').textContent = n;
  const iv = setInterval(() => {
    n -= 1;
    if (n <= 0) { clearInterval(iv); return; }
    document.getElementById('cdNum').textContent = n;
  }, 1000);
});

let myStopwatch = null;

socket.on('battleStarted', () => {
  show('battleScreen');
  if (!isBabyGame) startRecording();

  let elapsed = 0;
  document.getElementById('timerPill').textContent = '0:00';
  if (myStopwatch) clearInterval(myStopwatch);
  myStopwatch = setInterval(() => {
    elapsed += 1;
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('timerPill').textContent = m + ':' + String(s).padStart(2, '0');
  }, 1000);

  function tick() {
    const rms = getRms();
    socket.emit('volume', rms);

    const score = rmsToScore(rms);
    const pct = scoreToPercent(score);
    document.getElementById('speedoGlow').style.height = pct + '%';
    document.getElementById('speedoCar').style.transform = `scale(${0.92 + pct / 100 * 0.22})`;
    document.getElementById('speedoValue').innerHTML = Math.max(0, Math.round(score)) + '<span class="speedo-unit"> дБ</span>';
    const needleAngle = -90 + (pct / 100) * 180;
    document.getElementById('myNeedle').style.transform = `rotate(${needleAngle}deg)`;

    rafId = requestAnimationFrame(tick);
  }
  tick();
});

socket.on('battleOver', (results) => {
  cancelAnimationFrame(rafId);
  if (myStopwatch) { clearInterval(myStopwatch); myStopwatch = null; }
  if (!isBabyGame) stopRecordingAndSend();
  show('resultsScreen');
  const mine = results.find(r => r.id === socket.id);
  document.getElementById('placeBig').textContent = mine ? mine.place : '-';
  document.getElementById('myPeak').textContent = mine ? `Пик: ${Math.max(0, Math.round(mine.peakScore))} дБ` : '';
  document.getElementById('myDistance').textContent = mine ? `Проехал: ${(mine.totalDistanceKm || 0).toFixed(2)} км` : '';
  if (isBabyGame) {
    document.getElementById('babyResultArt').hidden = false;
    document.getElementById('babyResultArt').innerHTML = NurseryArt.baby(myBabyType, mine && mine.place === 1 ? 'cheer' : 'cry');
    document.getElementById('myDistance').textContent = mine ? `Малыш прополз ${Math.round(mine.progressPct || 0)}% пути` : '';
  }
});

socket.on('backToLobby', () => {
  cancelAnimationFrame(rafId);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  recordedChunks = [];
  show('waitScreen');
});

// Only the new mode uses this disconnect UI. The racing microphone loop is unchanged.
socket.on('disconnect', () => {
  teamChooser.left();
  if (!isBabyGame) return;
  cancelAnimationFrame(rafId);
  if (myStopwatch) { clearInterval(myStopwatch); myStopwatch = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); }
  recordedChunks = [];
  const banner = document.getElementById('playerConnection');
  banner.textContent = 'Связь прервана. Дождись подключения и зайди в комнату заново.';
  banner.hidden = false;
});
socket.on('connect', () => {
  if (!isBabyGame) return;
  show('joinScreen');
  const banner = document.getElementById('playerConnection');
  banner.textContent = 'Связь восстановлена. Проверь код комнаты у ведущего и подключись заново.';
  banner.hidden = false;
});
</script>
</body>
</html>
